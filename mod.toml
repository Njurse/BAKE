id = "bake"
name = "BAKE Toolkit"
version = "0.3.0"
# the JERICHO interface (SDK) this mod is built against
interface = 3
author = "Jaret Ludvik"
description = "Driver 1 (1999) traffic car shapes as a synthetic car-data source: bakes the seven retail Driver 1 cities plus the Euro-43 beta into carhacks, from your own Driver 1 data. See docs/DRIVER1.md."
# core suite: mandatory after carhacks and before mp
dependencies = ["carhacks"]
default-enabled = false
# External runtime unit: the BAKE tools and baked D1 data stay data/tooling.
runtime = "dll"
host_api = 2
